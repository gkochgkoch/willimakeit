name: willimakeit

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: willimakeit
      POSTGRES_USER: willimakeit
      POSTGRES_PASSWORD: willimakeit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U willimakeit -d willimakeit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

[project]
name = "willimakeit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GK", email = "ergewrgewrhewrhwerh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "agent-framework>=1.11.0",
    "agent-framework-openai>=1.10.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
willimakeit = "willimakeit:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.21",
]
